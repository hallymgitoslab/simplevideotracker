name: Moodle Plugin CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moodle-plugin-ci:
    name: Moodle ${{ matrix.moodle-branch }}
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [MOODLE_405_STABLE, MOODLE_500_STABLE, MOODLE_501_STABLE, MOODLE_502_STABLE, MOODLE_503_STABLE]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, zip, gd, soap, mbstring, xml
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer:v2
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          DB: mariadb
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: Validate Moodle plugin
        run: moodle-plugin-ci validate
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
